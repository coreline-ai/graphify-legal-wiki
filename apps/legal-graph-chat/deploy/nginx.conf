worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65s;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 60s;
    client_max_body_size 1m;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct=$upstream_connect_time uht=$upstream_header_time urt=$upstream_response_time';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    limit_req_status 429;
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=120r/m;
    limit_req_zone $binary_remote_addr zone=api_answer:10m rate=12r/m;
    limit_req_zone $binary_remote_addr zone=api_source:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=api_precedent_source:10m rate=20r/m;
    limit_req_zone $binary_remote_addr zone=api_full_3d:10m rate=6r/m;

    upstream legal_graph_frontend {
        server frontend:8080;
        keepalive 16;
    }

    upstream legal_graph_backend {
        server backend:8765;
        keepalive 16;
    }

    upstream oauth2_proxy {
        server oauth2-proxy:4180;
        keepalive 8;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 80;
        server_name _;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

        location = /nginx-healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location /oauth2/ {
            proxy_pass http://oauth2_proxy;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Uri $request_uri;
            proxy_set_header X-Auth-Request-Redirect $request_uri;
            proxy_set_header Connection "";
            proxy_buffering off;
        }

        location = /oauth2/auth {
            internal;
            proxy_pass http://oauth2_proxy/oauth2/auth;
            proxy_http_version 1.1;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Uri $request_uri;
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Auth-Request-Redirect $request_uri;
            proxy_set_header Connection "";
        }

        location @oauth2_start {
            return 302 /oauth2/start?rd=$scheme://$http_host$request_uri;
        }

        location = /api/answer {
            auth_request /oauth2/auth;
            error_page 401 = @oauth2_start;
            limit_req zone=api_answer burst=4 nodelay;
            proxy_pass http://legal_graph_backend/answer;
            proxy_http_version 1.1;
            proxy_read_timeout 60s;
            proxy_send_timeout 30s;
            proxy_connect_timeout 5s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Prefix /api;
            proxy_set_header Connection "";
            proxy_buffering on;
        }

        location = /api/source {
            auth_request /oauth2/auth;
            error_page 401 = @oauth2_start;
            limit_req zone=api_source burst=10 nodelay;
            proxy_pass http://legal_graph_backend/source;
            proxy_http_version 1.1;
            proxy_read_timeout 45s;
            proxy_send_timeout 30s;
            proxy_connect_timeout 5s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Prefix /api;
            proxy_set_header Connection "";
            proxy_buffering on;
        }

        location = /api/precedents/source {
            auth_request /oauth2/auth;
            error_page 401 = @oauth2_start;
            limit_req zone=api_precedent_source burst=8 nodelay;
            proxy_pass http://legal_graph_backend/precedents/source;
            proxy_http_version 1.1;
            proxy_read_timeout 45s;
            proxy_send_timeout 30s;
            proxy_connect_timeout 5s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Prefix /api;
            proxy_set_header Connection "";
            proxy_buffering on;
        }

        location = /api/graph/full-3d {
            auth_request /oauth2/auth;
            error_page 401 = @oauth2_start;
            limit_req zone=api_full_3d burst=2 nodelay;
            proxy_pass http://legal_graph_backend/graph/full-3d;
            proxy_http_version 1.1;
            proxy_read_timeout 120s;
            proxy_send_timeout 30s;
            proxy_connect_timeout 5s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Prefix /api;
            proxy_set_header Connection "";
            proxy_buffering on;
        }

        location /api/ {
            auth_request /oauth2/auth;
            error_page 401 = @oauth2_start;
            limit_req zone=api_general burst=40 nodelay;
            proxy_pass http://legal_graph_backend/;
            proxy_http_version 1.1;
            proxy_read_timeout 60s;
            proxy_send_timeout 30s;
            proxy_connect_timeout 5s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Prefix /api;
            proxy_set_header Connection "";
            proxy_buffering on;
        }

        location ~* \.(?:js|css|mjs|map|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
            auth_request /oauth2/auth;
            error_page 401 = @oauth2_start;
            proxy_pass http://legal_graph_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Connection "";
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable" always;
        }

        location / {
            auth_request /oauth2/auth;
            error_page 401 = @oauth2_start;
            proxy_pass http://legal_graph_frontend;
            proxy_http_version 1.1;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
            proxy_connect_timeout 5s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering on;
            add_header Cache-Control "no-store" always;
        }
    }
}
